name: Build Native Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Locate Project & Build APK
        run: |
          # Find the folder containing build.gradle or settings.gradle
          BUILD_DIR=$(find . -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs -I {} dirname {})
          
          if [ -z "$BUILD_DIR" ]; then
            echo "Error: Could not find build.gradle in the repository!"
            exit 1
          fi
          
          echo "Building inside directory: $BUILD_DIR"
          cd "$BUILD_DIR"

          # If gradlew exists, grant permission and run it
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            # If gradlew is missing, install gradle and build
            echo "gradlew not found. Generating wrapper..."
            gradle wrapper
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: clock-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          
