name: Build Native Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Android APK
        run: |
          # Find directory containing settings.gradle / settings.gradle.kts
          SETTINGS_DIR=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs -I {} dirname {})
          
          if [ -n "$SETTINGS_DIR" ]; then
            echo "Building from root project directory: $SETTINGS_DIR"
            cd "$SETTINGS_DIR"
          else
            echo "Building from repository root..."
          fi

          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: clock-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
